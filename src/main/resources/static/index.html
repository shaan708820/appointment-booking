<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect | Book an Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CareConnect</h1>
            <p>Book your doctor's appointment seamlessly.</p>
        </header>

        <main>
            <section class="booking-section">
                <h2>New Appointment</h2>
                <form id="appointmentForm">
                    <div class="form-group">
                        <label for="patientName">Patient Name</label>
                        <input type="text" id="patientName" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="doctorName">Select Doctor</label>
                        <select id="doctorName" required>
                            <option value="Dr. Smith (Cardiology)">Dr. Smith (Cardiology)</option>
                            <option value="Dr. Jane (Pediatrics)">Dr. Jane (Pediatrics)</option>
                            <option value="Dr. Allen (General)">Dr. Allen (General)</option>
                        </select>
                    </div>

                    <div class="form-group form-row">
                        <div class="half-width">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="half-width">
                            <label for="time">Time</label>
                            <input type="time" id="time" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Book Appointment</button>
                </form>
            </section>

            <section class="appointments-list">
                <h2>Upcoming Appointments</h2>
                <ul id="appointmentList">
                    <!-- Appointments will appear here -->
                </ul>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
